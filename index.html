<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureFlow</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header>
      <div class="header__main">
        <img
          class="header__logo"
          src="assets/logo.png"
          alt="SecureFlow's Logo"
          loading="eager"
        />
        <p class="header__title">SecureFlow</p>
      </div>
      <div>
        <label for="menuToggle" class="menu-toggle">☰ Menu</label>
        <input type="checkbox" id="menuToggle" class="menu-checkbox" />

        <nav class="mobile-nav">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero-container">
        <div>
          <p class="hero__trademark">Smareter security, stronger tomorrow</p>
          <p class="hero__trademark--large">
            Protect Your<br /><span>Digital World</span>
          </p>
          <p class="hero__description">
            SecureFlow is a modern cybersecurity SasS platform that helps<br />
            businessses detect, prevent, and response to threats -all in one
            place.
          </p>
          <div class="hero__actions">
            <button class="button button--primary">Get Started Free</button>
            <button class="button button--outline">Watch Demo</button>
          </div>
        </div>
        <img
          class="hero__img"
          src="assets/logo.png"
          alt="SecureFlow's Logo"
          loading="eager"
        />
      </section>
    </main>
  </body>
</html>
